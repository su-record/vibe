- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: entry-guard
  needs: [build]
  given: a file URL with a percent-encoded space, its decoded path, and a symlink to the file
  when: the guard's comparison runs
  then: the URL matches its own path and the symlink, and does not match another file; the built CLI still answers --version through a symlink
  check: { type: run, cmd: "npx vitest run src/cli.test.ts -t 'symlink|guard'", expect: 0, timeoutMs: 120000 }

- id: win-quoting
  needs: [build]
  given: an empty argument, a spaced one, one with a double quote, and a plain one
  when: the Windows shell quoting runs
  then: the first three are quoted for cmd.exe and the plain one is unchanged; the reader driver's argument list is quoted only on win32
  check: { type: run, cmd: "npx vitest run src/core/reader.test.ts -t 'quoting'", expect: 0, timeoutMs: 120000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: file-size
  needs: [build]
  then: no source file over 400 lines and no function over 50, judged by vibe size itself
  check: { type: run, cmd: "VIBE_SKIP_SETUP=1 node dist/cli.js size src hooks mcpb/server --max-file 400 --max-function 50", expect: 0 }

- id: skill-names
  then: every common skill name is spec-conformant and equals its directory
  check: { type: run, cmd: "node checks/skill-names.js", expect: 0 }

- id: packs
  then: every antislop pack has numbered reviewer stages within budget and agents in step
  check: { type: run, cmd: "node checks/packs.js", expect: 0 }

- id: report-voice
  then: card rule 9 and the handoff Report voice are present
  check: { type: run, cmd: "node checks/report-voice.js", expect: 0 }

- id: no-placeholders
  then: README, the card and the six common skills carry no placeholder text or reprinted writer note
  check: { type: run, cmd: "! grep -rlE 'Lorem ipsum|\\[TODO\\]|\\bTBD\\b|Your Company|\\{\\{|\\[\\[' README.md card.md skills/vibe/SKILL.md skills/vibe-*/SKILL.md", expect: 0 }

- id: no-catalogue
  then: no model name beyond the two aliases appears in the source
  check: { type: run, cmd: "! grep -rnE 'gpt-[0-9]|claude-(opus|sonnet|haiku)-[0-9]|luna|astra|sonnet|opus' src --include=*.ts --exclude=*.test.ts", expect: 0 }

- id: plugin-tree
  needs: [build]
  then: the committed manifests match package.json 4.1.19
  check: { type: run, cmd: "VIBE_SKIP_SETUP=1 node dist/cli.js plugin build --check && grep -q '\"version\": \"4.1.19\"' .codex-plugin/plugin.json", expect: 0 }

- id: readme-status
  then: the README status line carries a 4.1.19 entry
  check: { type: run, cmd: "grep -q '`4.1.19`' README.md", expect: 0 }
