- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: source-size
  then: non-test source is at most 5000 lines
  check: { type: run, cmd: "node checks/loc.js", expect: 0 }

- id: skills-size
  then: the six common skills are at most 300 lines in total
  check: { type: run, cmd: "test $(cat skills/*/SKILL.md | wc -l) -le 300", expect: 0 }

- id: harness-arm
  needs: [build]
  given: a bench ledger file with on and off arms
  when: ledger compare --by harness reads it
  then: the arms are on and off and the verdict is one of the four
  check: { type: run, cmd: "npx vitest run src/core/ledger.test.ts -t harness", expect: 0, timeoutMs: 120000 }

- id: judge-checkable
  then: every judge scenario of the settlement task is a file check bound to the same reference total as the example
  check: { type: run, cmd: "node checks/bench-judge.js", expect: 0 }

- id: bench-ran
  needs: [build]
  given: bench/run.js executed by a person for each arm
  when: bench/ledger.jsonl is read
  then: at least one judged run per arm (claude-code on/off, codex on/off) is present
  check: { type: run, cmd: "node checks/bench-ran.js", expect: 0 }

- id: compare-answers
  needs: [bench-ran]
  then: the comparison over the bench ledger returns one of the four verdicts, never a ratio
  check: { type: run, cmd: "node dist/cli.js ledger compare --by harness --metric checks --ledger bench/ledger.jsonl --min-runs 1", expect: 0 }
