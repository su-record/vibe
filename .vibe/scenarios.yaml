- id: build
  then: the package builds and every test passes
  check: { type: run, cmd: "npm run check", expect: 0, timeoutMs: 600000 }

- id: ask-stops
  needs: [build]
  given: an open question, then an answered one
  when: vibe ask runs and vibe state runs
  then: ask says stop and wait; next says wait while unanswered, and carries the answer once answered
  check: { type: run, cmd: "npx vitest run src/core/view.test.ts -t 'inbox' && npx vitest run src/cli.test.ts -t 'ask'", expect: 0, timeoutMs: 180000 }

- id: failure-files
  needs: [build]
  given: a scenario whose check fails
  when: vibe check runs
  then: the failed line names the scenario's files and next says fix with the files; the procedure phrase is quoted everywhere
  check: { type: run, cmd: "npx vitest run src/core/check.test.ts -t 'files' && node checks/procedure.js", expect: 0, timeoutMs: 180000 }

- id: claim-audit
  needs: [build]
  given: a transcript whose last assistant message claims completion while the state is RUNNING
  when: the Stop hook runs
  then: it blocks naming the claim and the state; a message without a claim, or DONE, passes
  check: { type: run, cmd: "npx vitest run src/install/notify.test.ts -t 'claim'", expect: 0, timeoutMs: 180000 }

- id: codex-trust
  needs: [build]
  given: a config.toml with and without hooks.state entries for vibe's hooks
  when: vibe status runs
  then: the codex line says trusted or how to trust
  check: { type: run, cmd: "npx vitest run src/install/register.test.ts -t 'trust'", expect: 0, timeoutMs: 180000 }

- id: scope-probe
  then: the scope skill says probe before scenarios and write the check first
  check: { type: run, cmd: "grep -q 'probe' skills/vibe-scope/SKILL.md && grep -q 'check script' skills/vibe-scope/SKILL.md", expect: 0 }

- id: gate-is-release
  needs: [build]
  given: the bench rerun on every set, five runs per arm, both clients
  when: the gate reads bench/ledger.jsonl
  then: every pre-registered rule passes, including Codex's ask turns at most twice bare
  check: { type: run, cmd: "node checks/bench-gate.js && node checks/bench-ran.js", expect: 0, timeoutMs: 120000 }

- id: size
  needs: [build]
  then: no file over 400 lines, no function over 50
  check: { type: run, cmd: "node dist/cli.js size src --max-file 400 --max-function 50", expect: 0 }

- id: card-size
  then: card.md is at most 1024 bytes and the six skills at most 300 lines; one procedure
  check: { type: run, cmd: "node checks/card-size.js && node checks/loc.js && node checks/procedure.js", expect: 0 }

- id: under-load
  needs: [build]
  then: the suite passes twice in parallel three times
  check: { type: run, cmd: "node checks/suite-under-load.js", expect: 0, timeoutMs: 900000 }
