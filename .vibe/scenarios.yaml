- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: source-size
  then: non-test source is at most 5000 lines
  check: { type: run, cmd: "node checks/loc.js", expect: 0 }

- id: skills-size
  then: the six common skills are at most 300 lines in total
  check: { type: run, cmd: "test $(cat skills/*/SKILL.md | wc -l) -le 300", expect: 0 }

- id: plugin-tree
  needs: [build]
  then: the committed manifests match package.json 4.1.3
  check: { type: run, cmd: "node dist/cli.js plugin build --check", expect: 0 }

- id: cli-lookup
  needs: [build]
  given: a server started with PATH=/nonexistent
  when: initialize is sent with and without the vibe_cli setting
  then: it names the CLI from the setting, and says CLI not found without it
  check: { type: run, cmd: "npx vitest run src/install/mcpb.test.ts -t 'without PATH'", expect: 0, timeoutMs: 120000 }

- id: manifest-setting
  needs: [build]
  then: the generated manifest carries the optional vibe_cli file setting mapped to VIBE_CLI
  check: { type: run, cmd: "node checks/mcpb-manifest.js", expect: 0 }
