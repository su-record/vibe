- id: compatibility
  then: Build and all existing behavior tests pass, with intentional surface
    changes covered by updated integration assertions. No model call is
    required.
  check:
    type: run
    cmd: npm run check
    timeoutMs: 600000
  verifiers:
    - src/core/verification.test.ts
    - src/core/performance.test.ts
    - src/core/risk-signals.test.ts
- id: personal-fde-surface
  then: The npm artifact and plugin advertise one entry, internal guides and skill
    extensions are present, and default hooks avoid extra work.
  needs:
    - compatibility
  check:
    type: run
    cmd: node checks/personal-fde.js && node checks/skill-names.js && node
      checks/packs.js && node checks/card-size.js && node checks/loc.js
    timeoutMs: 120000
  risk:
    kind: interface
    impact: Changing the shared parser or internal dispatch may bypass required
      checks or break existing desktop workflows.
    recovery: Revert the implementation while preserving legacy contracts and
      evidence; exercise legacy behavior and fail-closed prerequisite tests
      before release.
    failureChecks:
      - compatibility
    recoveryChecks:
      - compatibility
    paths:
      - src
      - mcpb
- id: performance-startup
  then: Fixed startup measurements complete and the recorded cost report is
    read-only, without model or arbitrary shell calls.
  needs:
    - compatibility
  check:
    type: run
    cmd: node dist/cli.js internal performance startup --json && node dist/cli.js
      internal performance report --json
    timeoutMs: 120000
- id: automatic-access
  then: Detected access changes retain failure and recovery guarantees
  risk:
    kind: access
    paths:
      - src
      - .github
    impact: Verification and client integration changes could weaken enforcement or
      break delivery.
    recovery: Restore the prior implementation; the compatibility suite exercises
      fail-closed behavior and existing integrations.
    failureChecks:
      - compatibility
    recoveryChecks:
      - compatibility
  needs:
    - compatibility
  check:
    type: run
    cmd: npx vitest run src/core/consent.test.ts
    timeoutMs: 120000
  verifiers:
    - src/core/consent.test.ts
- id: automatic-deployment
  then: Detected deployment changes retain failure and recovery guarantees
  risk:
    kind: deployment
    paths:
      - src
      - .github
    impact: Verification and client integration changes could weaken enforcement or
      break delivery.
    recovery: Restore the prior implementation; the compatibility suite exercises
      fail-closed behavior and existing integrations.
    failureChecks:
      - compatibility
    recoveryChecks:
      - compatibility
  needs:
    - compatibility
  check:
    type: run
    cmd: node dist/cli.js plugin build --check
    timeoutMs: 120000
  verifiers:
    - package.json
    - .claude-plugin/plugin.json
    - .claude-plugin/marketplace.json
    - .codex-plugin/plugin.json
- id: session-knowledge
  then: Session knowledge stays off until the person turns it on; when on, a
    changed turn or the configured number of conversation turns gives the model
    one knowledge turn and one log line, excluded folders are never recorded,
    skills are offered unless creation is allowed, and the wiki lint reports
    broken links, orphans and long pages. Turning on places the wiki in the
    Obsidian vault in use, or readies it as a vault that the first session
    after Obsidian has run lists, without overwriting or deleting pages. Two
    project folders with the same name get separate pages; a vibe project's
    shared knowledge is linked into the wiki except a synced one or one inside
    the project; the lint follows those links without calling their pages
    orphans but reports unlinked ones; each session start lists every shared
    page in a marked block of the project page and adds the page to the index,
    leaving other text alone; the brief and context read the project's own
    page; and vibe knowledge find ranks the wiki's and the project's pages by
    title, aliases, tags, summary and text, ranking superseded and archived
    pages lower and narrowing by type, while the wiki guide asks to find
    before writing and before choosing and to give each page a summary, type,
    tags and aliases; with the journal on, prompt and shell hooks keep a
    private masked 30-day journal (never in an excluded folder, nothing when
    off), the knowledge turn names it and vibe knowledge journal shows recent
    prompts, corrections and repeats, and the guide asks for at most one
    evidence-based improvement tracked in proposals.md.
  needs:
    - compatibility
  check:
    type: run
    cmd: npx vitest run src/core/knowledge-auto.test.ts src/core/knowledge.test.ts
      src/core/knowledge-lint.test.ts src/core/obsidian.test.ts
      src/core/knowledge-projects.test.ts src/core/context.test.ts
      src/cli/internal.test.ts src/core/knowledge-find.test.ts
      src/core/knowledge-journal.test.ts
    timeoutMs: 180000
  verifiers:
    - src/core/knowledge-auto.test.ts
    - src/core/knowledge.test.ts
    - src/core/knowledge-lint.test.ts
    - src/core/obsidian.test.ts
    - src/core/knowledge-projects.test.ts
    - src/core/context.test.ts
    - src/core/knowledge-find.test.ts
    - src/core/knowledge-journal.test.ts
- id: mutation
  then: Every change Stryker makes to the guide dispatch and to the Codex
    session line makes a test fail, so no mutant survives or goes untested.
  needs:
    - compatibility
  check:
    type: run
    cmd: node checks/mutation.js
    timeoutMs: 900000
  verifiers:
    - checks/mutation.js
    - src/cli/internal.test.ts
    - src/core/session.test.ts
