- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: file-size
  needs: [build]
  then: no source file over 400 lines and no function over 50, judged by vibe size itself
  check: { type: run, cmd: "node dist/cli.js size src hooks mcpb/server --max-file 400 --max-function 50", expect: 0 }

- id: skills-size
  then: the six common skills are at most 300 lines in total
  check: { type: run, cmd: "test $(cat skills/*/SKILL.md | wc -l) -le 300", expect: 0 }

- id: plugin-tree
  needs: [build]
  then: the committed manifests match package.json 4.1.6
  check: { type: run, cmd: "node dist/cli.js plugin build --check", expect: 0 }

- id: size-check
  needs: [build]
  given: a tree with a long file, a long function, a python module, a test file and node_modules
  when: measureSize runs
  then: the long file and the two long functions are reported, tests and node_modules are skipped
  check: { type: run, cmd: "npx vitest run src/core/size.test.ts", expect: 0, timeoutMs: 120000 }

- id: cli-modules
  then: the CLI is split into command modules and cli.ts only dispatches
  check: { type: run, cmd: "test -f src/cli/setup.ts -a -f src/cli/work.ts -a -f src/cli/human.ts -a -f src/cli/memory.ts && test $(wc -l < src/cli.ts) -le 150", expect: 0 }
