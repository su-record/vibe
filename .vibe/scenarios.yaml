- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: source-size
  then: non-test source is at most 5000 lines
  check: { type: run, cmd: "node checks/loc.js", expect: 0 }

- id: codex-init
  given: an empty project
  when: vibe init --client codex runs
  then: AGENTS.md carries the card, .codex/skills has the six common skills, .codex/hooks.json has the notification hooks
  check: { type: run, cmd: "npx vitest run src/install/codex.test.ts", expect: 0, timeoutMs: 120000 }

- id: plugin-install
  given: a home directory with vibe installed
  when: vibe plugin install runs
  then: a plugin tree with manifest, skills and hooks exists and the personal marketplace lists it; plugin status reports no drift
  check: { type: run, cmd: "npx vitest run src/install/plugin.test.ts", expect: 0, timeoutMs: 120000 }

- id: continuity
  given: an intent approved under one client
  when: the next check runs under another client
  then: the ledger shows both clients and the state carries over
  check: { type: run, cmd: "npx vitest run src/cli.test.ts -t continues", expect: 0, timeoutMs: 120000 }

- id: chatgpt-desktop
  then: after `vibe plugin install` and the two codex commands it prints, the vibe plugin appears in ChatGPT desktop
  check: { type: human, question: "Run `vibe plugin install` and the two codex commands it prints, restart ChatGPT desktop, and tell me whether the vibe plugin appears." }
