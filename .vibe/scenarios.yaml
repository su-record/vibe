- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: source-size
  then: non-test source is at most 5000 lines
  check: { type: run, cmd: "node checks/loc.js", expect: 0 }

- id: skills-size
  then: the six common skills are at most 300 lines in total
  check: { type: run, cmd: "test $(cat skills/*/SKILL.md | wc -l) -le 300", expect: 0 }

- id: implements-exact
  needs: [build]
  given: a git repository checked twice with one file edited in between
  when: the ledger edges of both checks are read
  then: the first check links every dirty file and the second links only the edited file
  check: { type: run, cmd: "npx vitest run src/core/check.test.ts -t implements", expect: 0, timeoutMs: 120000 }

- id: research-narrowing
  needs: [build]
  given: a fake GitHub client that answers nothing for three words and something for two
  when: research runs with the three-word query
  then: the two-word result is returned
  check: { type: run, cmd: "npx vitest run src/core/research.test.ts -t narrow", expect: 0, timeoutMs: 120000 }
