- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: source-size
  then: non-test source is at most 5000 lines
  check: { type: run, cmd: "node checks/loc.js", expect: 0 }

- id: http-eval-checks
  needs: [build]
  given: a local HTTP server and a labelled case set
  when: http and eval scenarios are checked
  then: status, schema and latency are judged by the harness; eval passes on a count of matching cases and lists mismatches
  check: { type: run, cmd: "npx vitest run src/core/checks -t 'http|eval'", expect: 0, timeoutMs: 120000 }

- id: table-sum
  needs: [build]
  given: a CSV with quoted fields and thousands separators
  when: a file check with sum runs
  then: the column total is compared to the reference within the tolerance
  check: { type: run, cmd: "npx vitest run src/core/checks/file.test.ts -t sum", expect: 0, timeoutMs: 120000 }

- id: profile
  needs: [build]
  given: a sample with empties, duplicates and mixed types
  when: vibe profile runs
  then: it reports types, missing counts, duplicates and at most three anomalies with numbers, and refuses a spreadsheet with a CSV hint
  check: { type: run, cmd: "npx vitest run src/core/profile.test.ts src/cli.test.ts -t profile", expect: 0, timeoutMs: 120000 }
