- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: source-size
  then: non-test source is at most 5000 lines
  check: { type: run, cmd: "node checks/loc.js", expect: 0 }

- id: skills-size
  then: the six common skills are at most 300 lines in total
  check: { type: run, cmd: "test $(cat skills/*/SKILL.md | wc -l) -le 300", expect: 0 }

- id: plugin-tree
  needs: [build]
  then: the committed manifests match package.json 4.1.1
  check: { type: run, cmd: "node dist/cli.js plugin build --check", expect: 0 }

- id: update
  needs: [build]
  given: a stand-in npm on PATH
  when: vibe update runs with an equal, a newer, and a failing registry
  then: it installs only when newer, reports the manual command on failure, and says when the registry is unreachable
  check: { type: run, cmd: "npx vitest run src/install/update.test.ts", expect: 0, timeoutMs: 120000 }

- id: status-update-line
  needs: [build]
  then: vibe status --json carries an update field and the help lists update [--check]
  check: { type: run, cmd: "VIBE_OFFLINE=1 node dist/cli.js status --json | grep -q '\"update\"' && node dist/cli.js --help | grep -q 'update \\[--check\\]'", expect: 0 }
