- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 400000 }

- id: brownfield-task
  then: bench/tasks/brownfield ships TASK.md, judge/prepare.cjs, judge/right.cjs, judge/lines.test.ts and a five-scenario judge; bench-judge accepts it; run.js runs a task's prepare.cjs
  check: { type: run, cmd: "node checks/bench-judge.js && test -f bench/tasks/brownfield/judge/prepare.cjs && test -f bench/tasks/brownfield/judge/right.cjs && test -f bench/tasks/brownfield/judge/lines.test.ts && test $(grep -c '^- id:' bench/tasks/brownfield/judge/scenarios.yaml) -ge 5 && grep -q 'prepare.cjs' bench/run.js", expect: 0 }

- id: brownfield-judge
  needs: [build]
  given: a workspace prepared from this repository, untouched, then with the reference patch applied
  when: the brownfield judge runs on each
  then: the untouched repository fails the tests scenario and the patched one passes every scenario
  check: { type: run, cmd: "node checks/direction-judges.js brownfield", expect: 0, timeoutMs: 600000 }

- id: tokens-metric
  needs: [build]
  given: a bench ledger with tokens per line
  when: ledger compare runs with --metric tokens, paired
  then: the arms compare on input + 0.1 cacheRead + 1.25 cacheWrite and the gate's context set applies the 0.7 rule
  check: { type: run, cmd: "npx vitest run src/core/ledger.test.ts -t 'tokens' && node checks/bench-gate.js --self-test", expect: 0, timeoutMs: 120000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: file-size
  needs: [build]
  then: no source file over 400 lines and no function over 50, judged by vibe size itself
  check: { type: run, cmd: "VIBE_SKIP_SETUP=1 node dist/cli.js size src hooks mcpb/server bench --max-file 400 --max-function 50", expect: 0 }

- id: skills-size
  then: the six common skills are at most 300 lines in total
  check: { type: run, cmd: "test $(cat skills/vibe/SKILL.md skills/vibe-*/SKILL.md | wc -l) -le 300", expect: 0 }

- id: skill-names
  then: every common skill name is spec-conformant and equals its directory
  check: { type: run, cmd: "node checks/skill-names.js", expect: 0 }

- id: packs
  then: every antislop pack has numbered reviewer stages within budget and agents in step
  check: { type: run, cmd: "node checks/packs.js", expect: 0 }

- id: report-voice
  then: card rule 9 and the handoff Report voice are present
  check: { type: run, cmd: "node checks/report-voice.js", expect: 0 }

- id: no-placeholders
  then: README, the card and the six common skills carry no placeholder text or reprinted writer note
  check: { type: run, cmd: "! grep -rlE 'Lorem ipsum|\\[TODO\\]|\\bTBD\\b|Your Company|\\{\\{|\\[\\[' README.md card.md skills/vibe/SKILL.md skills/vibe-*/SKILL.md", expect: 0 }

- id: no-catalogue
  then: no model name beyond the two aliases appears in the source
  check: { type: run, cmd: "! grep -rnE 'gpt-[0-9]|claude-(opus|sonnet|haiku)-[0-9]|luna|astra|sonnet|opus' src --include=*.ts --exclude=*.test.ts", expect: 0 }

- id: plugin-tree
  needs: [build]
  then: the committed manifests match package.json 4.1.22
  check: { type: run, cmd: "VIBE_SKIP_SETUP=1 node dist/cli.js plugin build --check && grep -q '\"version\": \"4.1.22\"' .codex-plugin/plugin.json", expect: 0 }

- id: readme-status
  then: the README names the brownfield task and --metric tokens and its status line carries a 4.1.22 entry
  check: { type: run, cmd: "grep -q '`4.1.22`' README.md && grep -q 'brownfield' README.md && grep -q -- '--metric tokens' README.md", expect: 0 }
