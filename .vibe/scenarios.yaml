- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: file-size
  needs: [build]
  then: no source file over 400 lines and no function over 50, judged by vibe size itself, with research.ts back on plain regex literals
  check: { type: run, cmd: "node dist/cli.js size src hooks mcpb/server --max-file 400 --max-function 50 && ! grep -q 'String.fromCharCode(96)' src/core/research.ts", expect: 0 }

- id: regex-literal
  needs: [build]
  given: a source file with regex literals holding quotes, backticks and braces, a division, and a template literal holding three double quotes
  when: vibe size measures it
  then: every function measures at its true length
  check: { type: run, cmd: "npx vitest run src/core/size.test.ts -t 'regex'", expect: 0, timeoutMs: 120000 }

- id: skill-names
  then: every common skill name is spec-conformant and equals its directory
  check: { type: run, cmd: "node checks/skill-names.js", expect: 0 }

- id: packs
  then: every antislop pack has numbered reviewer stages within budget and agents in step
  check: { type: run, cmd: "node checks/packs.js", expect: 0 }

- id: report-voice
  then: card rule 9 and the handoff Report voice are present
  check: { type: run, cmd: "node checks/report-voice.js", expect: 0 }

- id: no-placeholders
  then: README, the card and the six common skills carry no placeholder text or reprinted writer note
  check: { type: run, cmd: "! grep -rlE 'Lorem ipsum|\\[TODO\\]|\\bTBD\\b|Your Company|\\{\\{|\\[\\[' README.md card.md skills/vibe/SKILL.md skills/vibe-*/SKILL.md", expect: 0 }

- id: plugin-tree
  needs: [build]
  then: the committed manifests match package.json 4.1.15
  check: { type: run, cmd: "node dist/cli.js plugin build --check && grep -q '\"version\": \"4.1.15\"' .codex-plugin/plugin.json", expect: 0 }

- id: readme-status
  then: the README status line carries a 4.1.15 entry
  check: { type: run, cmd: "grep -q '`4.1.15`' README.md", expect: 0 }
