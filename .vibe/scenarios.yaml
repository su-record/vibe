- id: build
  then: the package builds and every test passes
  check: { type: run, cmd: "npm run check", expect: 0, timeoutMs: 600000 }

- id: scoped-arm
  needs: [build]
  given: bench/run.js with --harness scoped
  when: a workspace is prepared and judged
  then: the workspace holds card, skills and hooks but no intent; the ledger line says scoped and counts the agent's scenarios; the gate reads the third arm
  check: { type: run, cmd: "node checks/bench-scoped.js && node checks/bench-gate.js --self-test", expect: 0, timeoutMs: 300000 }

- id: anomaly-task
  needs: [build]
  given: bench/tasks/anomaly with its checks, key and judge
  when: the direction judges run
  then: the wrong answer (the brief taken literally) fails and the right one (the document followed) passes; vibe profile names the three anomalies
  check: { type: run, cmd: "node checks/direction-judges.js anomaly && node checks/bench-judge.js && node checks/bench-no-key.js && node checks/anomaly-profile.js", expect: 0, timeoutMs: 600000 }

- id: handover-task
  needs: [build]
  given: bench/tasks/handover with judge/meta.json naming two clients
  when: the direction judges run and run.js parses --client claude:codex
  then: the judge separates wrong from right; the runner names both clients on the line
  check: { type: run, cmd: "node checks/direction-judges.js handover && node checks/bench-handover.js", expect: 0, timeoutMs: 600000 }

- id: gate-is-release
  needs: [scoped-arm, anomaly-task, handover-task]
  given: the bench rerun on every set and arm
  when: the gate reads bench/ledger.jsonl
  then: every pre-registered rule passes
  check: { type: run, cmd: "node checks/bench-gate.js && node checks/bench-ran.js", expect: 0, timeoutMs: 120000 }

- id: size
  needs: [build]
  then: no file over 400 lines, no function over 50
  check: { type: run, cmd: "node dist/cli.js size src --max-file 400 --max-function 50", expect: 0 }

- id: card-size
  then: card.md is at most 1024 bytes and the six skills at most 300 lines; one procedure
  check: { type: run, cmd: "node checks/card-size.js && node checks/loc.js && node checks/procedure.js", expect: 0 }

- id: under-load
  needs: [build]
  then: the suite passes twice in parallel three times
  check: { type: run, cmd: "node checks/suite-under-load.js", expect: 0, timeoutMs: 900000 }
