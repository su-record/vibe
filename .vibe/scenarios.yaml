- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes with rule 8 present
  check: { type: run, cmd: "node checks/card-size.js && grep -q 'Read files whole' card.md", expect: 0 }

- id: source-size
  then: non-test source is at most 5000 lines
  check: { type: run, cmd: "node checks/loc.js", expect: 0 }

- id: skills-size
  then: the six common skills are at most 300 lines in total
  check: { type: run, cmd: "test $(cat skills/*/SKILL.md | wc -l) -le 300", expect: 0 }

- id: plugin-tree
  needs: [build]
  then: the committed manifests match package.json 4.1.4
  check: { type: run, cmd: "node dist/cli.js plugin build --check", expect: 0 }

- id: read-documents
  needs: [build]
  given: generated xlsx, docx, pptx and pdf fixtures
  when: vibe read and vibe profile run on them
  then: sheets become tables, paragraphs and slides keep their order, pdf text comes out with the reader named, long output is truncated with a hint
  check: { type: run, cmd: "npx vitest run src/core/docs", expect: 0, timeoutMs: 120000 }

- id: read-example
  needs: [build]
  then: vibe read on the example orders CSV prints a markdown table with the amount column
  check: { type: run, cmd: "node dist/cli.js read examples/order-settlement/orders.csv | grep -q '| order_id | date | seller | amount |'", expect: 0 }
