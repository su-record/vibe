- id: compatibility
  then: Build and all existing behavior tests pass, with intentional surface
    changes covered by updated integration assertions. No model call is
    required.
  check:
    type: run
    cmd: npm run check
    timeoutMs: 600000
  verifiers:
    - src/core/verification.test.ts
    - src/core/performance.test.ts
    - src/core/risk-signals.test.ts
- id: personal-fde-surface
  then: The npm artifact and plugin advertise one entry, internal guides and skill
    extensions are present, and default hooks avoid extra work.
  needs:
    - compatibility
  check:
    type: run
    cmd: node checks/personal-fde.js && node checks/skill-names.js && node
      checks/packs.js && node checks/card-size.js && node checks/loc.js
    timeoutMs: 120000
  risk:
    kind: interface
    impact: Changing the shared parser or internal dispatch may bypass required
      checks or break existing desktop workflows.
    recovery: Revert the implementation while preserving legacy contracts and
      evidence; exercise legacy behavior and fail-closed prerequisite tests
      before release.
    failureChecks:
      - compatibility
    recoveryChecks:
      - compatibility
    paths:
      - src
      - mcpb
- id: performance-startup
  then: Fixed startup measurements complete and the recorded cost report is
    read-only, without model or arbitrary shell calls.
  needs:
    - compatibility
  check:
    type: run
    cmd: node dist/cli.js internal performance startup --json && node dist/cli.js
      internal performance report --json
    timeoutMs: 120000
- id: automatic-access
  then: Detected access changes retain failure and recovery guarantees
  risk:
    kind: access
    paths:
      - src
      - .github
    impact: Verification and client integration changes could weaken enforcement or
      break delivery.
    recovery: Restore the prior implementation; the compatibility suite exercises
      fail-closed behavior and existing integrations.
    failureChecks:
      - compatibility
    recoveryChecks:
      - compatibility
  needs:
    - compatibility
  check:
    type: run
    cmd: npx vitest run src/core/consent.test.ts
    timeoutMs: 120000
  verifiers:
    - src/core/consent.test.ts
- id: automatic-deployment
  then: Detected deployment changes retain failure and recovery guarantees
  risk:
    kind: deployment
    paths:
      - src
      - .github
    impact: Verification and client integration changes could weaken enforcement or
      break delivery.
    recovery: Restore the prior implementation; the compatibility suite exercises
      fail-closed behavior and existing integrations.
    failureChecks:
      - compatibility
    recoveryChecks:
      - compatibility
  needs:
    - compatibility
  check:
    type: run
    cmd: node dist/cli.js plugin build --check
    timeoutMs: 120000
  verifiers:
    - package.json
    - .claude-plugin/plugin.json
    - .claude-plugin/marketplace.json
    - .codex-plugin/plugin.json
- id: mutation
  then: Every change Stryker makes to the guide dispatch and to the Codex
    session line makes a test fail, so no mutant survives or goes untested.
  needs:
    - compatibility
  check:
    type: run
    cmd: node checks/mutation.js
    timeoutMs: 900000
  verifiers:
    - checks/mutation.js
    - src/cli/internal.test.ts
    - src/core/session.test.ts
