- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: file-size
  needs: [build]
  then: no source file over 400 lines and no function over 50, judged by vibe size itself
  check: { type: run, cmd: "node dist/cli.js size src hooks mcpb/server --max-file 400 --max-function 50", expect: 0 }

- id: skills-size
  then: the six common skills are at most 300 lines in total and vibe-scope proposes pack code, traceable and a11y
  check: { type: run, cmd: "test $(cat skills/vibe/SKILL.md skills/vibe-*/SKILL.md | wc -l) -le 300 && grep -q 'pack: code' skills/vibe-scope/SKILL.md && grep -q 'traceable' skills/vibe-scope/SKILL.md && grep -q 'a11y' skills/vibe-scope/SKILL.md", expect: 0 }

- id: skill-names
  then: every common skill name is spec-conformant and equals its directory
  check: { type: run, cmd: "node checks/skill-names.js", expect: 0 }

- id: packs
  then: the three antislop packs (ko, en, design, code) have numbered reviewer stages within budget and agents in step
  check: { type: run, cmd: "node checks/packs.js && test -f skills/antislop-code/SKILL.md && test -f reviewers/code/1-reviewer.md && test -f reviewers/code/2-maintainer.md && test -f agents/code-reviewer.md && test -f agents/code-maintainer.md", expect: 0 }

- id: report-voice
  then: card rule 9 and the handoff Report voice are present
  check: { type: run, cmd: "node checks/report-voice.js", expect: 0 }

- id: no-placeholders
  then: README, the card and the six common skills carry no placeholder text or reprinted writer note
  check: { type: run, cmd: "! grep -rlE 'Lorem ipsum|\\[TODO\\]|\\bTBD\\b|Your Company|\\{\\{|\\[\\[' README.md card.md skills/vibe/SKILL.md skills/vibe-*/SKILL.md", expect: 0 }

- id: review-slim
  needs: [build]
  given: a fake claude and a fake codex on PATH that answer in each CLI's JSON and record their arguments
  when: the review check runs a text pack and the design pack through each driver
  then: claude gets the stage prompt as --system-prompt with the slim flags and the reviewer tools in the neutral directory, codex gets exec --skip-git-repo-check --json with the prompt leading the message, no --resume or resume appears anywhere, and the tail carries per-stage usage
  check: { type: run, cmd: "npx vitest run src/core/checks/review.test.ts -t 'driver'", expect: 0, timeoutMs: 120000 }

- id: review-live-claude
  needs: [build]
  given: the claude CLI and the slop fixtures
  when: the review check judges the design fixture and the code fixture through the Claude driver
  then: each is REJECTed at its first stage naming at least two catalogue markers, and the design run reports input tokens under 6000
  check: { type: run, cmd: "node checks/review-live.js claude", expect: 0, timeoutMs: 600000 }

- id: review-live-codex
  needs: [build]
  given: the codex CLI and the slop fixtures
  when: the review check judges the design fixture and the code fixture through the Codex driver
  then: each is REJECTed at its first stage naming at least two catalogue markers
  check: { type: run, cmd: "node checks/review-live.js codex", expect: 0, timeoutMs: 600000 }

- id: code-collector
  needs: [build]
  given: a directory with code files, a node_modules folder, a lock file and a binary
  when: the source collector runs for pack code
  then: the code files are numbered and listed in order, and node_modules, the lock file and the binary are skipped
  check: { type: run, cmd: "npx vitest run src/core/checks/source.test.ts -t 'code'", expect: 0, timeoutMs: 120000 }

- id: traceable
  needs: [build]
  given: a report with numbers and an evidence file
  when: a file check with traceable runs with every number present, then with one missing, then with a number inside a code fence
  then: present passes, the missing one fails naming line and number, the fenced one is ignored
  check: { type: run, cmd: "npx vitest run src/core/checks/file.test.ts -t 'traceable'", expect: 0, timeoutMs: 120000 }

- id: a11y
  needs: [build]
  given: an html file with a missing alt, a skipped heading, an unnamed button, an unlabelled input and a low-contrast rule, and a clean html file
  when: a file check with a11y runs on each
  then: the defects are named by line with the reason accessibility defect, and the clean file passes
  check: { type: run, cmd: "npx vitest run src/core/checks/file.test.ts -t 'a11y'", expect: 0, timeoutMs: 120000 }

- id: deterministic-live
  needs: [build]
  given: the design fixture and README's 4.1.10 measurement paragraph
  when: a11y runs on the fixture and traceable runs on the paragraph against checks/fixtures/readme-evidence.md
  then: the fixture fails a11y with at least two findings and the paragraph passes traceable
  check: { type: run, cmd: "node checks/deterministic-live.js", expect: 0, timeoutMs: 60000 }

- id: token-ledger
  needs: [build]
  given: a project and a fake claude driver
  when: vibe read --ask and a review stage run inside it, and once outside any project
  then: two usage events with tokens, client, model and cost are in the ledger and none outside, vibe ledger --json lists them, and ledger compare --metric cost includes their cost
  check: { type: run, cmd: "npx vitest run src/core/ledger.test.ts src/cli.test.ts -t 'usage'", expect: 0, timeoutMs: 180000 }

- id: skill-add-tree
  needs: [build]
  given: a fixture repository whose skill holds references/ and scripts/ subdirectories
  when: vibe skill add previews and then installs it
  then: the preview lists every file with its relative path, the install writes them under the skill directory, and a repository over the cap stops with a reason
  check: { type: run, cmd: "npx vitest run src/core/skills.test.ts -t 'tree'", expect: 0, timeoutMs: 120000 }

- id: highest-version
  needs: [build]
  given: a home whose marketplace points at a newer vibe install, and one that points at an older one
  when: registerClaude and registerCodex run from this package
  then: the newer install is left alone and reported current at its path, the older one is replaced, and status reports the version the client holds
  check: { type: run, cmd: "npx vitest run src/install/register.test.ts -t 'highest'", expect: 0, timeoutMs: 120000 }

- id: research-queries
  needs: [build]
  given: this repository's own intent and a fixture search that returns one repository matching only the word one
  when: queriesFromIntent and the research search run
  then: no query contains one, spec or slim, the queries name what the success section names, and the fixture repository is dropped as irrelevant
  check: { type: run, cmd: "npx vitest run src/core/research.test.ts -t 'intent'", expect: 0, timeoutMs: 120000 }

- id: plugin-tree
  needs: [build]
  then: the committed manifests match package.json 4.1.14 and the tree carries the code agents for Codex
  check: { type: run, cmd: "node dist/cli.js plugin build --check && grep -q '\"version\": \"4.1.14\"' .codex-plugin/plugin.json", expect: 0 }

- id: readme-status
  then: the README names traceable, a11y and antislop-code and its status line carries a 4.1.14 entry
  check: { type: run, cmd: "grep -q '`4.1.14`' README.md && grep -q 'traceable' README.md && grep -q 'a11y' README.md && grep -q 'antislop-code' README.md", expect: 0 }
