- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: source-size
  then: non-test source is at most 5000 lines
  check: { type: run, cmd: "node checks/loc.js", expect: 0 }

- id: skills-size
  then: the six common skills are at most 300 lines in total
  check: { type: run, cmd: "test $(cat skills/*/SKILL.md | wc -l) -le 300", expect: 0 }

- id: example-profile
  needs: [build]
  given: examples/order-settlement/orders.csv with a duplicate row and a missing amount
  when: vibe profile runs on it
  then: both anomalies are named with their numbers
  check: { type: run, cmd: "node checks/example-profile.js", expect: 0 }

- id: settle
  given: the example orders
  when: settle.js runs
  then: out/settlement.csv and out/summary.json are produced
  check: { type: run, cmd: "node examples/order-settlement/settle.js", expect: 0 }

- id: settlement-total
  needs: [settle]
  then: the total column sums to 4500.5 — the paid, de-duplicated, amount-bearing orders
  check: { type: file, path: examples/order-settlement/out/settlement.csv, sum: { column: total, equals: 4500.5 } }

- id: settlement-summary
  needs: [settle]
  then: summary.json matches its schema and lists order 1004 for a person
  check: { type: file, path: examples/order-settlement/out/summary.json, schema: examples/order-settlement/summary.schema.json, contains: "\"1004\"" }

- id: send-dry-run
  needs: [settlement-total, settlement-summary]
  irreversible: send
  then: the sheet would go to accounting — the dry run exits 0; the real send needs a human token
  check: { type: run, cmd: "node examples/order-settlement/send.js --dry-run", expect: 0 }

- id: example-skill
  needs: [build]
  given: a project-local skill created from the settle scenario
  when: the registry and a prune dry run are inspected
  then: the skill carries the settle check and is kept
  check: { type: run, cmd: "node checks/example-skill.js", expect: 0 }
