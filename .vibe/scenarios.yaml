- id: build
  given: the source tree exists
  when: tsc builds it
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  given: dist exists
  when: vitest runs
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: source-size
  then: non-test source is at most 5000 lines
  check: { type: run, cmd: "node checks/loc.js", expect: 0 }

- id: no-self-done
  then: the model (code) cannot make DONE without check, and APPROVED cannot happen without a token
  check: { type: run, cmd: "npx vitest run src/core/check.test.ts src/core/intent.test.ts -t \"without\"", expect: 0, timeoutMs: 120000 }

- id: card-reads
  then: the eight lines of the card are readable by a non-engineer
  check: { type: human, question: "Read the eight lines of card.md. If any line is unclear, tell me its number." }
