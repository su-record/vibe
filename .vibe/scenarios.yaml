- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: source-size
  then: non-test source is at most 5000 lines
  check: { type: run, cmd: "node checks/loc.js", expect: 0 }

- id: skills-size
  then: the six common skills are at most 300 lines in total
  check: { type: run, cmd: "test $(cat skills/*/SKILL.md | wc -l) -le 300", expect: 0 }

- id: plugin-tree
  needs: [build]
  then: the committed manifests match package.json 4.1.2
  check: { type: run, cmd: "node dist/cli.js plugin build --check", expect: 0 }

- id: mcpb-bundle
  needs: [build]
  given: the package on disk
  when: vibe plugin mcpb runs
  then: a valid zip with manifest, server and README is written and python's zipfile validates it
  check: { type: run, cmd: "npx vitest run src/install/mcpb.test.ts -t 'valid zip'", expect: 0, timeoutMs: 120000 }

- id: mcpb-server
  needs: [build]
  given: the vibe CLI on PATH and an empty project folder
  when: a stdio client sends initialize, tools/list and tools/call
  then: the server answers, drafts an intent through the CLI, and rejects an unknown tool with a JSON-RPC error
  check: { type: run, cmd: "npx vitest run src/install/mcpb.test.ts -t 'stdio'", expect: 0, timeoutMs: 120000 }

- id: claude-app-visible
  then: the bundle installs in the Claude desktop app and vibe_state answers there
  check: { type: human, question: "Run `vibe plugin mcpb --out ~/Desktop/vibe.mcpb`, open the file in the Claude desktop app, pick a project folder, and ask Claude to call vibe_state — does it answer?" }
