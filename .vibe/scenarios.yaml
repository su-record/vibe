- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: file-size
  needs: [build]
  then: no source file over 400 lines and no function over 50, judged by vibe size itself
  check: { type: run, cmd: "node dist/cli.js size src hooks mcpb/server --max-file 400 --max-function 50", expect: 0 }

- id: model-config
  needs: [build]
  given: a project whose config names a reader model and effort and a reviewer model, fake claude and codex CLIs on PATH, and the env overrides
  when: vibe read --ask and a review stage run
  then: the drivers receive the configured flags, the env wins over config, unset keeps the defaults, and a changed model starts a new session
  check: { type: run, cmd: "npx vitest run src/core/reader.test.ts src/core/checks/review.test.ts src/core/config.test.ts -t 'model'", expect: 0, timeoutMs: 180000 }

- id: no-catalogue
  then: no model name beyond the two aliases appears in the source
  check: { type: run, cmd: "! grep -rnE 'gpt-[0-9]|claude-(opus|sonnet|haiku)-[0-9]|luna|astra|sonnet|opus' src --include=*.ts --exclude=*.test.ts", expect: 0 }

- id: skill-names
  then: every common skill name is spec-conformant and equals its directory
  check: { type: run, cmd: "node checks/skill-names.js", expect: 0 }

- id: packs
  then: every antislop pack has numbered reviewer stages within budget and agents in step
  check: { type: run, cmd: "node checks/packs.js", expect: 0 }

- id: report-voice
  then: card rule 9 and the handoff Report voice are present
  check: { type: run, cmd: "node checks/report-voice.js", expect: 0 }

- id: no-placeholders
  then: README, the card and the six common skills carry no placeholder text or reprinted writer note
  check: { type: run, cmd: "! grep -rlE 'Lorem ipsum|\\[TODO\\]|\\bTBD\\b|Your Company|\\{\\{|\\[\\[' README.md card.md skills/vibe/SKILL.md skills/vibe-*/SKILL.md", expect: 0 }

- id: plugin-tree
  needs: [build]
  then: the committed manifests match package.json 4.1.17
  check: { type: run, cmd: "node dist/cli.js plugin build --check && grep -q '\"version\": \"4.1.17\"' .codex-plugin/plugin.json", expect: 0 }

- id: readme-status
  then: the README documents reader and reviewer model settings and its status line carries a 4.1.17 entry
  check: { type: run, cmd: "grep -q '`4.1.17`' README.md && grep -q 'VIBE_REVIEWER_MODEL' README.md", expect: 0 }
