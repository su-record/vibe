- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: source-size
  then: non-test source is at most 5000 lines
  check: { type: run, cmd: "node checks/loc.js", expect: 0 }

- id: skills-size
  then: the six common skills are at most 300 lines in total
  check: { type: run, cmd: "test $(cat skills/*/SKILL.md | wc -l) -le 300", expect: 0 }

- id: plugin-tree
  needs: [build]
  given: the committed marketplace files
  when: vibe plugin build --check runs
  then: nothing differs from what package.json generates
  check: { type: run, cmd: "node dist/cli.js plugin build --check", expect: 0 }

- id: plugin-hooks
  needs: [build]
  given: a home with and without the npm install
  when: session.js and notify.js --plugin run
  then: the card is handed over once, the CLI state is named, and both hooks step back when the npm install owns the client
  check: { type: run, cmd: "npx vitest run src/install/tree.test.ts -t hooks", expect: 0, timeoutMs: 120000 }

- id: hermes
  needs: [build]
  given: a home with ~/.hermes
  when: the surfaces are installed and removed
  then: SOUL.md carries the card block, the six skills are present, no hook file, and uninstall restores SOUL.md
  check: { type: run, cmd: "npx vitest run src/install/global.test.ts -t hermes", expect: 0, timeoutMs: 120000 }

- id: plugin-mode
  needs: [build]
  given: stand-in claude and codex CLIs on PATH
  when: setup, status, ensure and uninstall run
  then: the package registers as a local plugin, updates an older one, re-points a stray marketplace, writes no home surfaces, and unregisters on uninstall; VIBE_NO_PLUGIN keeps the home path
  check: { type: run, cmd: "npx vitest run src/install/register.test.ts", expect: 0, timeoutMs: 120000 }

- id: plugin-visible
  then: after `npm i -g @su-record/vibe` the Claude Code /plugin list shows vibe@vibe, Codex lists vibe, and ChatGPT desktop shows the plugin
  check: { type: human, question: "After `npm i -g @su-record/vibe@4.1.0`, open Claude Code and run /plugin, run `codex plugin list`, and restart ChatGPT desktop — tell me which of the three show vibe." }
