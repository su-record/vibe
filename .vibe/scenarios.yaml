- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: file-size
  needs: [build]
  then: no source file over 400 lines and no function over 50, judged by vibe size itself
  check: { type: run, cmd: "node dist/cli.js size src hooks mcpb/server --max-file 400 --max-function 50", expect: 0 }

- id: changed-collector
  needs: [build]
  given: a temporary git repository with a committed tree, one modified file, one file importing it, one unrelated file, one untracked file, one deleted file and a Python pair
  when: the collector runs with changed true and with a ref, in a directory that is not a repository, and with nothing changed
  then: the selection is the changed files and their one-hop dependents with roles, the ref form diffs against it, no repository fails with the reason, nothing changed passes with the tail
  check: { type: run, cmd: "npx vitest run src/core/checks/source.test.ts src/core/checks/review.test.ts -t 'changed'", expect: 0, timeoutMs: 120000 }

- id: changed-live
  needs: [build]
  given: this repository with src/core/checks/source.ts modified in the working tree
  when: the code collector runs with changed true over src
  then: source.ts is listed as changed, review.ts as dependent, and no file that neither changed nor imports a changed file is listed
  check: { type: run, cmd: "node checks/changed-live.js", expect: 0, timeoutMs: 60000 }

- id: skills-size
  then: the six common skills are at most 300 lines in total and vibe-scope proposes changed true on directory reviews
  check: { type: run, cmd: "test $(cat skills/vibe/SKILL.md skills/vibe-*/SKILL.md | wc -l) -le 300 && grep -q 'changed: true' skills/vibe-scope/SKILL.md", expect: 0 }

- id: skill-names
  then: every common skill name is spec-conformant and equals its directory
  check: { type: run, cmd: "node checks/skill-names.js", expect: 0 }

- id: packs
  then: every antislop pack has numbered reviewer stages within budget and agents in step
  check: { type: run, cmd: "node checks/packs.js", expect: 0 }

- id: report-voice
  then: card rule 9 and the handoff Report voice are present
  check: { type: run, cmd: "node checks/report-voice.js", expect: 0 }

- id: no-placeholders
  then: README, the card and the six common skills carry no placeholder text or reprinted writer note
  check: { type: run, cmd: "! grep -rlE 'Lorem ipsum|\\[TODO\\]|\\bTBD\\b|Your Company|\\{\\{|\\[\\[' README.md card.md skills/vibe/SKILL.md skills/vibe-*/SKILL.md", expect: 0 }

- id: plugin-tree
  needs: [build]
  then: the committed manifests match package.json 4.1.16
  check: { type: run, cmd: "node dist/cli.js plugin build --check && grep -q '\"version\": \"4.1.16\"' .codex-plugin/plugin.json", expect: 0 }

- id: readme-status
  then: the README check table names changed and the status line carries a 4.1.16 entry
  check: { type: run, cmd: "grep -q '`4.1.16`' README.md && grep -q 'changed' README.md", expect: 0 }
