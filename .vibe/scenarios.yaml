- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: source-size
  then: non-test source is at most 5000 lines
  check: { type: run, cmd: "node checks/loc.js", expect: 0 }

- id: skills-size
  then: the six common skills are at most 300 lines in total
  check: { type: run, cmd: "test $(cat skills/*/SKILL.md | wc -l) -le 300", expect: 0 }

- id: research
  needs: [build]
  given: a fake GitHub client with repositories, code and three catalogs
  when: research runs with a query, from the intent, and without a network
  then: candidates are ranked with an action each, noise is dropped, a note and a ledger line are written, the cache answers offline, and skills are found at any catalog depth
  check: { type: run, cmd: "npx vitest run src/core/research.test.ts", expect: 0, timeoutMs: 120000 }

- id: skills
  needs: [build]
  given: a project with scenarios, regressions and repeated questions
  when: skills are created, added through a fixture, listed, used, pruned, suggested and dismissed
  then: nothing installs without a check or without --yes, the commit is pinned, unused skills go, proposals follow the signals
  check: { type: run, cmd: "npx vitest run src/core/skills.test.ts src/cli.test.ts -t 'skill'", expect: 0, timeoutMs: 180000 }
