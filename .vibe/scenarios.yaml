- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 400000 }

- id: next-line
  needs: [build]
  given: projects in DRAFT with intent, APPROVED with three cheap scenarios, RUNNING with one remaining, STUCK, DONE, and one with an open inbox question
  when: vibe state runs in each
  then: the next line names approve, build a b c then check --all, check --all remaining, answer inbox, report, and prove respectively, size says small for the three-cheap project and full for a project with a review check, and the JSON carries next and size
  check: { type: run, cmd: "npx vitest run src/core/view.test.ts -t 'next'", expect: 0, timeoutMs: 120000 }

- id: card-size
  then: the card is at most 1024 bytes, rule 2 names the small-task fast path, rule 6 says a regression is only a failure vibe check reported
  check: { type: run, cmd: "node checks/card-size.js && grep -q 'check --all' card.md && grep -q 'reported' card.md", expect: 0 }

- id: router
  then: the router skill routes by the next line, never re-enters scope with an approved intent, and loads a stage skill only when next names one; scope says a check observes; the six common skills stay within 300 lines
  check: { type: run, cmd: "grep -q 'next' skills/vibe/SKILL.md && grep -q 'never re-enter' skills/vibe/SKILL.md && grep -q 'observes' skills/vibe-scope/SKILL.md && test $(cat skills/vibe/SKILL.md skills/vibe-*/SKILL.md | wc -l) -le 300", expect: 0 }

- id: direction-tasks
  then: bench/tasks holds hidden-requirement, regression-trap, long-context and ambiguous-brief with deterministic judges, and bench-judge accepts them; run.js takes --set
  check: { type: run, cmd: "node checks/bench-judge.js && for t in hidden-requirement regression-trap long-context ambiguous-brief; do test -f bench/tasks/$t/judge/scenarios.yaml || exit 1; done && grep -q -- '--set' bench/run.js", expect: 0 }

- id: direction-judges
  needs: [build]
  given: each direction task's fixture with the obvious wrong answer applied and with the right answer applied
  when: the task's judge runs on each
  then: the wrong answer fails at least one judge scenario and the right answer passes them all, for every direction task
  check: { type: run, cmd: "node checks/direction-judges.js", expect: 0, timeoutMs: 300000 }

- id: compare-filters
  needs: [build]
  given: a bench ledger with two clients and three tasks
  when: ledger compare runs with --client and --task
  then: only the matching runs are compared, and bench-gate names the set and task that fails a rule
  check: { type: run, cmd: "npx vitest run src/core/ledger.test.ts -t 'filter' && node checks/bench-gate.js --self-test", expect: 0, timeoutMs: 120000 }

- id: on-arm-surfaces
  then: the bench on arm installs the six common skills only unless the judge uses a review check
  check: { type: run, cmd: "grep -q 'SKILL_NAMES' bench/run.js && ! grep -q 'languagePacks' bench/run.js", expect: 0 }

- id: check-observes
  needs: [build]
  given: a scenario whose run check is npm run db:restore && npm test, one declared irreversible, and one plain
  when: vibe check --all runs, then after vibe authorize --action restore, and vibe regress record is tried on the restore scenario
  then: the restore scenario is blocked with the reason and DONE stays out of reach, the plain one runs, the declared one is blocked the same way, after authorize the restore runs, and the regression is refused with the observe rule
  check: { type: run, cmd: "npx vitest run src/core/check.test.ts src/core/scenarios.test.ts src/core/regress.test.ts -t 'mutat|observe'", expect: 0, timeoutMs: 180000 }

- id: file-size
  needs: [build]
  then: no source file over 400 lines and no function over 50, judged by vibe size itself
  check: { type: run, cmd: "VIBE_SKIP_SETUP=1 node dist/cli.js size src hooks mcpb/server bench --max-file 400 --max-function 50", expect: 0 }

- id: skill-names
  then: every common skill name is spec-conformant and equals its directory
  check: { type: run, cmd: "node checks/skill-names.js", expect: 0 }

- id: packs
  then: every antislop pack has numbered reviewer stages within budget and agents in step
  check: { type: run, cmd: "node checks/packs.js", expect: 0 }

- id: report-voice
  then: card rule 9 and the handoff Report voice are present
  check: { type: run, cmd: "node checks/report-voice.js", expect: 0 }

- id: no-placeholders
  then: README, the card and the six common skills carry no placeholder text or reprinted writer note
  check: { type: run, cmd: "! grep -rlE 'Lorem ipsum|\\[TODO\\]|\\bTBD\\b|Your Company|\\{\\{|\\[\\[' README.md card.md skills/vibe/SKILL.md skills/vibe-*/SKILL.md", expect: 0 }

- id: no-catalogue
  then: no model name beyond the two aliases appears in the source
  check: { type: run, cmd: "! grep -rnE 'gpt-[0-9]|claude-(opus|sonnet|haiku)-[0-9]|luna|astra|sonnet|opus' src --include=*.ts --exclude=*.test.ts", expect: 0 }

- id: plugin-tree
  needs: [build]
  then: the committed manifests match package.json 4.1.21
  check: { type: run, cmd: "VIBE_SKIP_SETUP=1 node dist/cli.js plugin build --check && grep -q '\"version\": \"4.1.21\"' .codex-plugin/plugin.json", expect: 0 }

- id: readme-status
  then: the README describes the next line, the fast path and the two bench sets, and its status line carries a 4.1.21 entry
  check: { type: run, cmd: "grep -q '`4.1.21`' README.md && grep -q 'direction set' README.md && grep -q 'fast path' README.md", expect: 0 }
