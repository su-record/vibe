- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: file-size
  needs: [build]
  then: no source file over 400 lines and no function over 50, judged by vibe size itself
  check: { type: run, cmd: "node dist/cli.js size src hooks mcpb/server --max-file 400 --max-function 50", expect: 0 }

- id: skills-size
  then: the six common skills are at most 300 lines in total
  check: { type: run, cmd: "test $(cat skills/vibe/SKILL.md skills/vibe-*/SKILL.md | wc -l) -le 300", expect: 0 }

- id: skill-names
  then: every common skill name is spec-conformant and equals its directory, and none of the six is tracked under the repository's .claude/skills or .codex/skills
  check: { type: run, cmd: "node checks/skill-names.js", expect: 0 }

- id: language-pack
  then: every skills/antislop-*/SKILL.md is at most 600 lines, every reviewers/*/ prompt at most 300, each pack has both reviewers, pack names conform, and the reviewers name no Claude-only tool
  check: { type: run, cmd: "node checks/language-pack.js", expect: 0 }

- id: plugin-tree
  needs: [build]
  then: the committed manifests match package.json 4.1.9 and the plugin tree carries the language pack
  check: { type: run, cmd: "node dist/cli.js plugin build --check && grep -q '\"version\": \"4.1.9\"' .codex-plugin/plugin.json", expect: 0 }

- id: codex-stale
  needs: [build]
  given: a home with the codex CLI, a Codex cache holding an older vibe plugin, and a marketplace entry pointing at ./.vibe/plugin/vibe
  when: status is read, ensureGlobal runs, status is read again, ensureGlobal runs again
  then: the first status reports the old version and not current; the repair rewrites the marketplace to the new tree and logs plugin remove then plugin add; the second status reports the package version and current; the second ensureGlobal runs nothing
  check: { type: run, cmd: "npx vitest run src/install/register.test.ts -t 'codex behind'", expect: 0, timeoutMs: 120000 }

- id: marketplace-drift
  needs: [build]
  given: an installed tree whose marketplace entry is edited to point elsewhere
  when: pluginStatus runs
  then: drift names the path the entry points at, and registered stays true
  check: { type: run, cmd: "npx vitest run src/install/plugin.test.ts -t 'marketplace points'", expect: 0, timeoutMs: 120000 }

- id: codex-unreadable-cache
  needs: [build]
  given: a home with the codex CLI whose Codex cache has no vibe entry after registration
  when: ensureGlobal runs a second time
  then: nothing runs again — an unreadable cache is not stale
  check: { type: run, cmd: "npx vitest run src/install/register.test.ts -t 'codex gets the assembled tree'", expect: 0, timeoutMs: 120000 }

- id: readme-status
  then: the README status line carries a 4.1.9 entry
  check: { type: run, cmd: "grep -q '`4.1.9`' README.md", expect: 0 }
