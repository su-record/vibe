- id: build
  then: dist is produced without type errors
  check: { type: run, cmd: "npm run build", expect: 0, timeoutMs: 120000 }

- id: tests
  needs: [build]
  then: every test passes
  check: { type: run, cmd: "npm test", expect: 0, timeoutMs: 300000 }

- id: card-size
  then: the always-on card is at most 1024 bytes
  check: { type: run, cmd: "node checks/card-size.js", expect: 0 }

- id: source-size
  then: non-test source is at most 5000 lines
  check: { type: run, cmd: "node checks/loc.js", expect: 0 }

- id: needs-edges
  needs: [build]
  given: scenarios that declare needs
  when: they are drafted and checked
  then: unknown ids, cycles and human parents are rejected; independent scenarios run in parallel; a dependent of a failed parent is blocked and not run
  check: { type: run, cmd: "npx vitest run src/core/scenarios.test.ts src/core/check.test.ts -t needs", expect: 0, timeoutMs: 120000 }

- id: ledger-why
  needs: [build]
  given: a drafted, approved, checked intent with a recorded regression
  when: vibe ledger why is asked about the regression or a changed file
  then: the answer walks caused, implements and decided-by edges back to the approval
  check: { type: run, cmd: "npx vitest run src/cli.test.ts -t 'ledger why'", expect: 0, timeoutMs: 120000 }

- id: state-graph
  needs: [build]
  then: vibe state --graph prints mermaid with one node per scenario, one edge per needs entry, and the last result on each node
  check: { type: run, cmd: "npx vitest run src/cli.test.ts -t 'state --graph'", expect: 0, timeoutMs: 120000 }
