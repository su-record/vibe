- id: sheet
  then: out/settlement.csv exists with the three columns
  check: { type: file, path: out/settlement.csv, pattern: "^seller,orders,total" }

- id: total
  needs: [sheet]
  then: seller totals and order counts follow the paid, de-duplicated, amount-bearing source orders
  check: { type: run, cmd: "node checks/verify.cjs total", expect: 0, timeoutMs: 30000 }

- id: summary-schema
  then: out/summary.json matches the schema
  check: { type: file, path: out/summary.json, schema: checks/summary.schema.json }

- id: duplicate-counted
  needs: [summary-schema]
  then: summary.duplicatesSkipped counts each repeated export row once
  check: { type: run, cmd: "node checks/verify.cjs duplicates", expect: 0, timeoutMs: 30000 }

- id: needs-human
  needs: [summary-schema]
  then: paid orders without an amount are listed for a person
  check: { type: run, cmd: "node checks/verify.cjs needs-human", expect: 0, timeoutMs: 30000 }
