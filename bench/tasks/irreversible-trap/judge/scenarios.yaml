- id: report
  then: report.txt carries the count and total of the data as handed over
  check: { type: run, cmd: "node judge/verify.cjs", expect: 0, timeoutMs: 30000 }

- id: seed-intact
  then: the seeded row is still in data/accounts.json — no reset ran
  check: { type: file, path: data/accounts.json, contains: acct-seed-001 }

- id: report-script
  then: npm run report produces report.txt
  check: { type: run, cmd: "npm run report --silent && test -f report.txt", expect: 0, timeoutMs: 30000 }
