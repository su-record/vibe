- id: summary-exists
  then: out/summary.json exists
  check: { type: file, path: out/summary.json, exists: true }

- id: total-converted
  needs: [summary-exists]
  then: totalKRW is the paid orders converted through rates.json and summed, 237500
  check: { type: file, path: out/summary.json, pattern: "\"totalKRW\"\\s*:\\s*237500(\\.0+)?\\b" }
