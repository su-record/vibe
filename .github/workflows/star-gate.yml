name: Star Gate

# PR 은 대상에서 제외한다 — 이 워크플로는 댓글만 다는 것이 아니라 대상을 닫는다.
# 코드 기여를 스타 여부로 닫으면 첫 기여자가 그대로 이탈한다. 홍보 효과는 이슈 쪽에 남긴다.
on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  star-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const item = context.payload.issue;
            const author = item.user.login;
            if (item.user.type === 'Bot') return;
            if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(item.author_association)) return;

            const stargazers = await github.paginate(github.rest.activity.listStargazersForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            if (stargazers.some((user) => user.login === author)) {
              core.info(`@${author} starred the repo — gate passed`);
              return;
            }

            const body = [
              `안녕하세요 @${author}! 이 저장소는 ⭐ 스타를 누른 분들의 이슈를 받고 있어요.`,
              '',
              `Hi @${author}! This repo accepts issues from stargazers.`,
              `Please [star the repo](https://github.com/${context.repo.owner}/${context.repo.repo}/stargazers) and reopen this issue — the gate will pass automatically on reopen. Thanks! 🙏`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: item.number,
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: item.number,
              state: 'closed',
              state_reason: 'not_planned',
            });
