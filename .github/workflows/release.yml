name: Release

# One entrance: push a tag `vX.Y.Z` that matches package.json. Publishing uses npm OIDC trusted
# publishing (no token in secrets), which is bound to this workflow file name — keep `release.yml`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24' # npm >= 11.5 for OIDC trusted publishing
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Tag matches package.json
        run: |
          set -euo pipefail
          PKG_TAG="v$(node -p "require('./package.json').version")"
          if [ "$PKG_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($PKG_TAG)"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node checks/card-size.js && node checks/loc.js
      - run: node dist/cli.js plugin build --check

      - name: Release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## $GITHUB_REF_NAME"
            echo
            if [ -n "$PREV" ]; then git log --no-merges --pretty='- %s' "$PREV..$GITHUB_REF_NAME"; else git log --no-merges --pretty='- %s' -n 30; fi
          } > release-notes.md

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --access public --provenance

      - name: GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
