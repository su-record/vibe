name: Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 버전은 package.json packageManager 가 SSOT

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (tsc)
        run: pnpm build

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 버전은 package.json packageManager 가 SSOT

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (tsc) # dist/ 필요 — 훅 테스트가 dist/tools 동적 import 를 검증 (code-check-memory-write)
        run: pnpm build

      - name: Run vitest
        run: pnpm test -- --reporter=default

      # 플러그인 배포 트리는 커밋되는 생성물이다 — Claude Code 마켓플레이스가
      # 저장소를 클론해 읽으므로 dist/ 와 구운 agents/ 가 트리에 있어야 한다.
      # 소스만 고치고 트리를 잊으면 플러그인 사용자만 구버전을 받게 되므로
      # 드리프트를 여기서 막는다.
      - name: Plugin hook definitions in sync
        run: pnpm gen:plugin-hooks:check

      - name: Plugin tree matches source
        run: pnpm validate:plugin-tree
