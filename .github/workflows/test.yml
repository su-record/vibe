name: Test

on:
  pull_request:
    branches: [main, v4]
  push:
    branches: [main, v4]

jobs:
  check:
    name: Build · Test · Self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # vibe 4 가 자기 시나리오를 자기 CLI 로 판정한다. 승인은 사람 토큰이라 CI 에서는 카드·크기 검사만 직접 돈다.
      - run: node checks/card-size.js
      - run: node checks/loc.js
