name: Test

on:
  pull_request:
    branches: [main, v4]
  push:
    branches: [main, v4]

jobs:
  check:
    name: Build · Test · Self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # vibe 4 judges its own scenarios with its own CLI. Approval is a human token, so CI runs the size checks directly.
      - run: node checks/card-size.js
      - run: node checks/loc.js
