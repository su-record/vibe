name: Build & Test

on:
  pull_request:
    branches: [main, v4]
  push:
    branches: [main, v4]

# Job names match the main branch protection rule: "Build (type-check)" and "Tests".
jobs:
  build:
    name: Build (type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # vibe 4 judges its own scenarios with its own CLI; approval is a person's, so CI runs the size gates directly.
      - run: node checks/card-size.js
      - run: node checks/loc.js
      - run: test $(cat skills/vibe/SKILL.md skills/vibe-*/SKILL.md | wc -l) -le 300
      - run: node checks/skill-names.js
      - run: node checks/packs.js
      - run: node dist/cli.js plugin build --check
      # Deterministic integrated-contract checks; CI never starts the paid cohort or waits on its own CI receipt.
      - run: node checks/bench-public.js
      - run: node checks/discovery-contract.js
      - run: node checks/work-opportunities.js
      - run: node checks/release-4.1.26.js --self-test
      - run: node checks/check-trust-compatibility.js --self-test

  windows:
    name: Windows
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # the fixtures that fake a client CLI with a POSIX shim or a symlink stay Linux-only for now (named for the next release);
      # everything else — the map, the checks, the ledger, the size lexer, the hook — runs here too
      - run: npx vitest run --exclude "**/{cli,global,register,reader,review,capabilities,plugin,update,skills,research,mcpb}.test.ts"
      - run: node checks/check-trust.js
      - run: node checks/check-evidence-privacy.js
      - run: node checks/scenario-handoff.js
      - run: node checks/stop-session-contract.js
      - run: node checks/release-4.1.26.js --self-test
      - run: node checks/check-trust-compatibility.js --self-test
      # the CLI through npm's .cmd shim, the way a global install runs it on Windows
      - run: npm i -g .
      - run: vibe --version
      - run: vibe state
        env:
          VIBE_SKIP_SETUP: '1'
      # a fake reader on PATH: the read --ask driver must survive cmd.exe's argument joining
      - run: node checks/win-read.js
        shell: cmd
